<!-- templates/indicadores/dashboard_general.html -->
{% load static %}
<!DOCTYPE html>
<html lang="es-cl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indicadores - Sistema SGR</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
</head>
<body>

<!--
    TODO: por ahora este template es independiente.
    Mas adelante va a heredar de base.html usando extends y bloques de contenido.
-->

<div class="container mt-4">

    <h2>Dashboard general</h2>

    {% for persona in personas %}
    <div class="card mb-3" style="width: 100%; max-width: 500px;">
        <div class="card-body">
            <h5 class="card-title">{{ persona.nombre }}</h5>
            <h6 class="card-subtitle mb-2 text-muted">{{ persona.cargo }}</h6>

            <hr>

            <ul class="list-group list-group-flush">
                {% for item in persona.items %}
                <li class="list-group-item d-flex justify-content-between">
                    <span>{{ item.nombre }}</span>
                    <span>{{ item.avance }} / {{ item.meta }}</span>
                    <span>Ponderador : {{ item.ponderador }}</span>
                </li>
                {% endfor %}
            </ul>

        </div>
    </div>
    {% endfor %}

</div>

<script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
